# ============================================
# Fonts - Material Design Icons
# ============================================

font:
  - file: "gfonts://Roboto"
    id: font_16
    size: ${font_s_size}

  - file: "gfonts://Roboto"
    id: font_24
    size: ${font_m_size}

  - file: "gfonts://Roboto"
    id: font_32
    size: ${font_l_size}
    extras:
      - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - "\U000F0238"  # mdi:thermometer
          - "\U000F0502"  # mdi:movie
          - "\U000F05A8"  # mdi:power
          - "\U000F04B9"  # mdi:sofa

  - file: "gfonts://Roboto"
    id: font_48
    size: ${font_xl_size}

  # Material Design Icons
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_32
    size: ${font_m_size}
    glyphs:
      - "\U000F0335"  # mdi:lightbulb
      - "\U000F06E8"  # mdi:lightbulb-on
      - "\U000F0142"  # mdi:cog (settings)
      - "\U000F004D"  # mdi:arrow-left
      - "\U000F0054"  # mdi:arrow-right
      - "\U000F0156"  # mdi:close
      - "\U000F012C"  # mdi:check
      - "\U000F0765"  # mdi:palette (color)
      - "\U000F0238"  # mdi:thermometer (temperature)
      - "\U000F058C"  # mdi:brightness-6 (brightness)
      - "\U000F0594"  # mdi:weather-night (night mode)

# ============================================
# Colors
# ============================================

color:
  - id: color_white
    hex: "FFFFFF"
  - id: color_dark_bg
    hex: "2C3E50"
  - id: color_green
    hex: "4CAF50"
  - id: color_cyan
    hex: "00BCD4"
  - id: color_yellow
    hex: "FFEB3B"
  - id: color_pink
    hex: "E91E63"
  - id: color_red
    hex: "F44336"
  - id: color_btn_off
    hex: "2C3E50"

# ============================================
# LVGL Configuration
# ============================================

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  color_depth: 16
  buffer_size: 10%
  log_level: WARN
  theme:
    button:
      checked:
        bg_color: 0xFFC107

  style_definitions:
    - id: style_btn
      radius: 10
      border_width: 0
      bg_color: color_dark_bg
      text_color: color_white

    - id: style_btn_on
      bg_color: color_green

  # Top bar is always visible (page 0 equivalent)
  top_layer:
    widgets:
      - label:
          id: lbl_status
          x: 240
          y: 8
          width: 230
          height: ${top_h}
          text_align: RIGHT
          text_font: ${f_title}
          text_color: color_white
          bg_opa: TRANSP
          text: "Loading..."

  pages:
    # ========== MAIN PAGE (Page 1 equivalent) ==========
    - id: page_main
      scrollbar_mode: "off"
      width: ${disp_w}
      height: ${disp_h}
      bg_color: 0x000000
      widgets:
        # Light button 1 - Lampadario
        - button:
            id: btn_lampadario
            x: ${main_col_1_x}
            y: ${main_row_1_y}
            width: ${main_btn_w}
            height: ${main_btn_h}
            styles: style_btn
            checkable: true
            widgets:
              - label:
                  id: lbl_btn_lampadario
                  align: CENTER
                  text_font: ${f_icon}
                  text: "${icon_main_1}"
            on_short_click:
              - homeassistant.service:
                  service: ${service_main_1}
                  data:
                    entity_id: ${light_main_1}

        # Light button 2 - Gruppo Letto
        - button:
            id: btn_gruppo_letto
            x: ${main_col_1_x}
            y: ${main_row_2_y}
            width: ${main_btn_w}
            height: ${main_btn_h}
            styles: style_btn
            checkable: true
            widgets:
              - label:
                  id: lbl_btn_gruppo_letto
                  align: CENTER
                  text_font: ${f_icon}
                  text: "${icon_main_2}"
            on_short_click:
              - homeassistant.service:
                  service: ${service_main_2}
                  data:
                    entity_id: ${light_main_2}

        # Light button 3 - All lights (tall button)
        - button:
            id: btn_mrc_lights
            x: ${main_col_2_x}
            y: ${main_row_1_y}
            width: ${main_btn_all_w}
            height: ${main_btn_all_h}
            styles: style_btn
            checkable: true
            widgets:
              - label:
                  id: lbl_btn_mrc_lights
                  align: CENTER
                  text_font: ${f_icon}
                  text: "${icon_main_3}"
            on_short_click:
              - homeassistant.service:
                  service: ${service_main_3}
                  data:
                    entity_id: ${light_main_all}

        # CO2 Arc meter - full circle
        - arc:
            id: arc_co2
            x: ${co2_arc_x}
            y: ${co2_arc_y}
            width: ${co2_arc_w}
            height: ${co2_arc_h}
            min_value: 0
            max_value: ${co2_max_value}
            value: 400
            adjustable: false
            rotation: 270
            start_angle: 0
            end_angle: 360
            bg_opa: TRANSP
            border_width: 0
            arc_width: 12
            arc_color: 0x333333
            indicator:
              arc_color: color_green
              arc_width: 12
            knob:
              bg_opa: TRANSP
              width: 0
              height: 0

        # CO2 Value label - centered within arc
        - label:
            id: lbl_co2_value
            x: ${co2_arc_x}
            y: ${co2_lbl_val_y}
            width: ${co2_arc_w}
            height: 60
            text_align: CENTER
            text_font: ${f_huge}
            text: "---"
            text_color: color_white
            bg_opa: TRANSP

        # CO2 Unit label
        - label:
            id: lbl_co2_unit
            x: ${co2_arc_x}
            y: ${co2_lbl_unit_y}
            width: ${co2_arc_w}
            height: 30
            text_align: CENTER
            text_font: ${f_title}
            text: "${co2_label}"
            text_color: color_white
            bg_opa: TRANSP

        # Settings button - goes to first enabled page
        - button:
            id: btn_settings
            x: ${btn_set_x}
            y: ${btn_set_y}
            width: ${btn_set_w}
            height: ${btn_set_h}
            radius: ${btn_set_rad}
            border_width: 0
            bg_color: color_dark_bg
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_title}
                  text: "Imposta"
                  text_color: color_white
            on_short_click:
              - if:
                  condition:
                    lambda: 'return strcmp("${enable_scenes_page}", "true") == 0;'
                  then:
                    - lvgl.page.show: page_scenes
                  else:
                    - if:
                        condition:
                          lambda: 'return strcmp("${enable_lights_page_1}", "true") == 0;'
                        then:
                          - lvgl.page.show: page_lights
                        else:
                          - if:
                              condition:
                                lambda: 'return strcmp("${enable_lights_page_2}", "true") == 0;'
                              then:
                                - lvgl.page.show: page_lights_2

    # ========== SCENES PAGE ==========
    - id: page_scenes
      scrollbar_mode: "off"
      width: ${disp_w}
      height: ${disp_h}
      bg_color: 0x000000
      widgets:
        # Scene 1 (top-left)
        - button:
            id: btn_scene_1
            x: ${scene_col_1_x}
            y: ${scene_row_1_y}
            width: ${scene_btn_w}
            height: ${scene_btn_h}
            radius: 10
            border_width: 0
            bg_color: ${scene_1_bg_color}
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_large}
                  text_color: ${scene_1_text_color}
                  text: "${scene_1_label}"
            on_short_click:
              - homeassistant.service:
                  service: script.turn_on
                  data:
                    entity_id: ${scene_1}

        # Scene 2 (top-right)
