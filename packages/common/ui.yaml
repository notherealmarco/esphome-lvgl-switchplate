                    entity_id: ${scene_3}

        # Scene 4 (bottom-right)
        - button:
            id: btn_scene_4
            x: ${scene_col_2_x}
            y: ${scene_row_2_y}
            width: ${scene_btn_w}
            height: ${scene_btn_h}
            radius: 10
            border_width: 0
            bg_color: ${scene_4_bg_color}
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_large}
                  text_color: ${scene_4_text_color}
                  text: "${scene_4_label}"
            on_short_click:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: ${scene_4}

        # Next page button (to lights)
        - button:
            x: ${nav_next_x}
            y: ${nav_row_y}
            width: ${nav_btn_w}
            height: ${nav_btn_h}
            radius: 10
            border_width: 0
            bg_color: color_dark_bg
            widgets:
              - label:
                  align: CENTER
                  text_font: mdi_32
                  text: "\U000F0054"
            on_short_click:
              - if:
                  condition:
                    lambda: 'return strcmp("${enable_lights_page_1}", "true") == 0;'
                  then:
                    - lvgl.page.show: page_lights
                  else:
                    - if:
                        condition:
                          lambda: 'return strcmp("${enable_lights_page_2}", "true") == 0;'
                        then:
                          - lvgl.page.show: page_lights_2
                        else:
                          - lvgl.page.show: page_main

        # Back button
        - button:
            x: ${nav_back_x}
            y: ${nav_row_y}
            width: ${nav_btn_w}
            height: ${nav_btn_h}
            radius: 10
            border_width: 0
            bg_color: 0xD32F2F
            widgets:
              - label:
                  align: CENTER
                  text_font: mdi_32
                  text: "\U000F004D"
            on_short_click:
              - lvgl.page.show: page_main

