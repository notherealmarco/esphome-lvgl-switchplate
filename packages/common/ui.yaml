                  data:
                    entity_id: ${scene_2}

        # Scene 3 (bottom-left)
        - button:
            id: btn_scene_3
            x: ${scene_col_1_x}
            y: ${scene_row_2_y}
            width: ${scene_btn_w}
            height: ${scene_btn_h}
