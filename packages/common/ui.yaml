# ============================================
# LVGL Configuration
# ============================================

lvgl:
  displays:
    - my_display
  rotation: ${display_rotation}
  touchscreens:
    - my_touchscreen
  color_depth: 16
  buffer_size: 10%
  log_level: WARN
  theme:
    button:
      checked:
        bg_color: 0xFFC107

  style_definitions:
    - id: style_btn
      radius: 10
      border_width: 0
      bg_color: color_dark_bg
      text_color: color_white

    - id: style_btn_on
      bg_color: color_green

  # Top bar is always visible (page 0 equivalent)
  top_layer:
    widgets:
      - label:
          id: lbl_status
          x: 240
          y: 8
          width: 230
          height: ${top_h}
          text_align: RIGHT
          text_font: ${f_title}
          text_color: color_white
          bg_opa: TRANSP
          text: "Loading..."

  pages:
    # ========== MAIN PAGE (Page 1 equivalent) ==========
    - id: page_main
      scrollbar_mode: "off"
      width: ${disp_w}
      height: ${disp_h}
      bg_color: 0x000000
      widgets:
        # Light button 1 - Lampadario
        - button:
            id: btn_lampadario
            x: ${main_col_1_x}
            y: ${main_row_1_y}
            width: ${main_btn_w}
            height: ${main_btn_h}
            styles: style_btn
            checkable: true
            widgets:
              - label:
                  id: lbl_btn_lampadario
                  align: CENTER
                  text_font: ${f_icon}
                  text: "${icon_main_1}"
            on_short_click:
              - homeassistant.service:
                  service: ${service_main_1}
                  data:
                    entity_id: ${light_main_1}

        # Light button 2 - Gruppo Letto
        - button:
            id: btn_gruppo_letto
            x: ${main_col_1_x}
            y: ${main_row_2_y}
            width: ${main_btn_w}
            height: ${main_btn_h}
            styles: style_btn
            checkable: true
            widgets:
              - label:
                  id: lbl_btn_gruppo_letto
                  align: CENTER
                  text_font: ${f_icon}
                  text: "${icon_main_2}"
            on_short_click:
              - homeassistant.service:
                  service: ${service_main_2}
                  data:
                    entity_id: ${light_main_2}

        # Light button 3 - All lights (tall button)
        - button:
            id: btn_mrc_lights
            x: ${main_col_2_x}
            y: ${main_row_1_y}
            width: ${main_btn_all_w}
            height: ${main_btn_all_h}
            styles: style_btn
            checkable: true
            widgets:
              - label:
                  id: lbl_btn_mrc_lights
                  align: CENTER
                  text_font: ${f_icon}
                  text: "${icon_main_3}"
            on_short_click:
              - homeassistant.service:
                  service: ${service_main_3}
                  data:
                    entity_id: ${light_main_all}

        # CO2 Arc meter - full circle
        - arc:
            id: arc_co2
            x: ${co2_arc_x}
            y: ${co2_arc_y}
            width: ${co2_arc_w}
            height: ${co2_arc_h}
            min_value: 0
            max_value: ${co2_max_value}
            value: 400
            adjustable: false
            rotation: 270
            start_angle: 0
            end_angle: 360
            bg_opa: TRANSP
            border_width: 0
            arc_width: 12
            arc_color: 0x333333
            indicator:
              arc_color: color_green
              arc_width: 12
            knob:
              bg_opa: TRANSP
              width: 0
              height: 0

        # CO2 Value label - centered within arc
        - label:
            id: lbl_co2_value
            x: ${co2_arc_x}
            y: ${co2_lbl_val_y}
            width: ${co2_arc_w}
            height: 60
            text_align: CENTER
            text_font: ${f_huge}
            text: "---"
            text_color: color_white
            bg_opa: TRANSP

        # CO2 Unit label
        - label:
            id: lbl_co2_unit
            x: ${co2_arc_x}
            y: ${co2_lbl_unit_y}
            width: ${co2_arc_w}
            height: 30
            text_align: CENTER
            text_font: ${f_title}
            text: "${co2_label}"
            text_color: color_white
            bg_opa: TRANSP

        # Settings button - goes to first enabled page
        - button:
            id: btn_settings
            x: ${btn_set_x}
            y: ${btn_set_y}
            width: ${btn_set_w}
            height: ${btn_set_h}
            radius: ${btn_set_rad}
            border_width: 0
            bg_color: color_dark_bg
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_title}
                  text: "Imposta"
                  text_color: color_white
            on_short_click:
              - if:
                  condition:
                    lambda: 'return strcmp("${enable_scenes_page}", "true") == 0;'
                  then:
                    - lvgl.page.show: page_scenes
                  else:
                    - if:
                        condition:
                          lambda: 'return strcmp("${enable_lights_page_1}", "true") == 0;'
                        then:
                          - lvgl.page.show: page_lights
                        else:
                          - if:
                              condition:
                                lambda: 'return strcmp("${enable_lights_page_2}", "true") == 0;'
                              then:
                                - lvgl.page.show: page_lights_2

    # ========== SCENES PAGE ==========
    - id: page_scenes
      scrollbar_mode: "off"
      width: ${disp_w}
      height: ${disp_h}
      bg_color: 0x000000
      widgets:
        # Scene 1 (top-left)
        - button:
            id: btn_scene_1
            x: ${scene_col_1_x}
            y: ${scene_row_1_y}
            width: ${scene_btn_w}
            height: ${scene_btn_h}
            radius: 10
            border_width: 0
            bg_color: ${scene_1_bg_color}
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_large}
                  text_color: ${scene_1_text_color}
                  text: "${scene_1_label}"
            on_short_click:
              - homeassistant.service:
                  service: script.turn_on
                  data:
                    entity_id: ${scene_1}

        # Scene 2 (top-right)
        - button:
            id: btn_scene_2
            x: ${scene_col_2_x}
            y: ${scene_row_1_y}
            width: ${scene_btn_w}
            height: ${scene_btn_h}
            radius: 10
            border_width: 0
            bg_color: ${scene_2_bg_color}
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_large}
                  text_color: ${scene_2_text_color}
                  text: "${scene_2_label}"
            on_short_click:
              - homeassistant.service:
                  service: script.turn_on
                  data:
                    entity_id: ${scene_2}

        # Scene 3 (bottom-left)
        - button:
            id: btn_scene_3
            x: ${scene_col_1_x}
            y: ${scene_row_2_y}
            width: ${scene_btn_w}
            height: ${scene_btn_h}
            radius: 10
            border_width: 0
            bg_color: ${scene_3_bg_color}
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_large}
                  text_color: ${scene_3_text_color}
                  text: "${scene_3_label}"
            on_short_click:
              - homeassistant.service:
                  service: script.turn_on
                  data:
                    entity_id: ${scene_3}

        # Scene 4 (bottom-right)
        - button:
            id: btn_scene_4
            x: ${scene_col_2_x}
            y: ${scene_row_2_y}
            width: ${scene_btn_w}
            height: ${scene_btn_h}
            radius: 10
            border_width: 0
            bg_color: ${scene_4_bg_color}
            widgets:
              - label:
                  align: CENTER
                  text_font: ${f_large}
                  text_color: ${scene_4_text_color}
                  text: "${scene_4_label}"
            on_short_click:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: ${scene_4}

        # Next page button (to lights)
        - button:
            x: ${nav_next_x}
            y: ${nav_row_y}
            width: ${nav_btn_w}
            height: ${nav_btn_h}
            radius: 10
            border_width: 0
            bg_color: color_dark_bg
            widgets:
              - label:
                  align: CENTER
                  text_font: mdi_32
                  text: "\U000F0054"
            on_short_click:
              - if:
                  condition:
                    lambda: 'return strcmp("${enable_lights_page_1}", "true") == 0;'
                  then:
                    - lvgl.page.show: page_lights
                  else:
                    - if:
                        condition:
                          lambda: 'return strcmp("${enable_lights_page_2}", "true") == 0;'
                        then:
                          - lvgl.page.show: page_lights_2
                        else:
                          - lvgl.page.show: page_main

        # Back button
        - button:
            x: ${nav_back_x}
            y: ${nav_row_y}
            width: ${nav_btn_w}
            height: ${nav_btn_h}
            radius: 10
            border_width: 0
            bg_color: 0xD32F2F
            widgets:
              - label:
                  align: CENTER
                  text_font: mdi_32
                  text: "\U000F004D"
            on_short_click:
              - lvgl.page.show: page_main

    # ========== LIGHTS SELECTION PAGE 1 ==========
    - id: page_lights
      scrollbar_mode: "off"
      width: ${disp_w}
      height: ${disp_h}
