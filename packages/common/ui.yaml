# ============================================
# Helpers
# ============================================

number:
  - platform: template
    name: "AOD Brightness"
    id: aod_brightness
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    restore_value: true
    initial_value: 10
    icon: "mdi:brightness-6"

switch:
  - platform: template
    name: "Always On Display"
    id: aod_mode
    optimistic: true
    icon: "mdi:monitor-eye"

button:
  - platform: template
    name: "Wake Screen"
    id: wake_screen
    icon: "mdi:monitor-shimmer"
    on_press:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - lambda: |-
          lv_disp_trig_activity(NULL);

# ============================================
# Intervals and Updates
# ============================================

interval:
  # Update status bar with temperature and humidity
  - interval: 5s
    then:
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            if (id(ha_temp_hum).has_state() && id(ha_humidity).has_state()) {
              char buf[32];
              snprintf(buf, sizeof(buf), "%.0f%% %.1f°C",
                atof(id(ha_humidity).state.c_str()),
                atof(id(ha_temp_hum).state.c_str()));
              return std::string(buf);
            }
            return std::string("--% --°C");

  # Update CO2 display
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(co2_sensor).has_state();'
          then:
            - lvgl.arc.update:
                id: arc_co2
                value: !lambda 'return (int)id(co2_sensor).state;'
                indicator:
                  arc_color: !lambda |-
                    int co2 = (int)id(co2_sensor).state;
                    if (co2 <= ${co2_threshold_green}) return lv_color_hex(0x4CAF50);      // green
                    else if (co2 <= ${co2_threshold_cyan}) return lv_color_hex(0x00BCD4); // cyan
                    else if (co2 <= ${co2_threshold_yellow}) return lv_color_hex(0xFFEB3B); // yellow
                    else if (co2 <= ${co2_threshold_pink}) return lv_color_hex(0xE91E63); // pink
                    else return lv_color_hex(0xF44336);                  // red
            - lvgl.label.update:
                id: lbl_co2_value
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d", (int)id(co2_sensor).state);
                  return std::string(buf);

  # Update light name labels on color/temp pages
  - interval: 500ms
    then:
      - lvgl.label.update:
          id: lbl_color_light_name
          text: !lambda 'return id(selected_light_name);'
      - lvgl.label.update:
          id: lbl_temp_light_name
          text: !lambda 'return id(selected_light_name);'

  # Info Screen Cycle
  - interval: ${info_cycle_interval}
    then:
      - if:
          condition:
            lambda: 'return lv_scr_act() == id(page_info)->obj;'
          then:
            - lambda: |-
                // Increment mode
                int current_mode = id(info_mode);
                int next_mode = current_mode;
                
                // Try to find next valid sensor (max 5 attempts)
                // Mode 0 = Clock only (initial), 1-5 = Sensors
                // If mode 0, go to 1.
                if (next_mode == 0) next_mode = 0; // Start at 0? No, 1.

                for(int i=0; i<6; i++) {
                  next_mode++;
                  if (next_mode > 5) next_mode = 1;
                  
                  bool valid = false;
                  if (next_mode == 1 && id(ha_info_1).has_state()) valid = true;
                  else if (next_mode == 2 && id(ha_info_2).has_state()) valid = true;
                  else if (next_mode == 3 && id(ha_info_3).has_state()) valid = true;
                  else if (next_mode == 4 && id(ha_info_4).has_state()) valid = true;
                  else if (next_mode == 5 && id(ha_info_5).has_state()) valid = true;
                  
                  if (valid) {
                    id(info_mode) = next_mode;
                    break;
                  }
                }
                
                // Update UI based on new mode
                int m = id(info_mode);
                std::string icon = "";
                std::string unit = "";
                std::string value = "--";
                
                if (m == 1) { icon = "${info_sensor_1_icon}"; unit = "${info_sensor_1_unit}"; value = id(ha_info_1).state; }
                else if (m == 2) { icon = "${info_sensor_2_icon}"; unit = "${info_sensor_2_unit}"; value = id(ha_info_2).state; }
                else if (m == 3) { icon = "${info_sensor_3_icon}"; unit = "${info_sensor_3_unit}"; value = id(ha_info_3).state; }
                else if (m == 4) { icon = "${info_sensor_4_icon}"; unit = "${info_sensor_4_unit}"; value = id(ha_info_4).state; }
                else if (m == 5) { icon = "${info_sensor_5_icon}"; unit = "${info_sensor_5_unit}"; value = id(ha_info_5).state; }
                
                // Round value to 2 decimal places (if numeric)
                if (value != "--" && !value.empty()) {
                  char* endptr;
                  float fval = strtof(value.c_str(), &endptr);
                  // Only format if entire string was parsed as a number
                  if (*endptr == '\0' || *endptr == ' ') {
                    char buf[16];
                    snprintf(buf, sizeof(buf), "%.2f", fval);
                    value = buf;
                    // Remove trailing zeros (20.00 -> 20, 20.50 -> 20.5)
                    size_t dot = value.find('.');
                    if (dot != std::string::npos) {
                      while (value.size() > dot + 1 && value.back() == '0') value.pop_back();
                      if (value.back() == '.') value.pop_back();
                    }
                  }
                }
                
                // Update combined sensor label (icon + value + unit)
                std::string combined = icon + "  " + value;
                if (!unit.empty()) combined += " " + unit;
                lv_label_set_text(id(lbl_info_sensor), combined.c_str());

  # Update Info Screen Clock/Date and Weather
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return lv_scr_act() == id(page_info)->obj;'
          then:
            - lvgl.label.update:
                id: lbl_info_time
                text: !lambda 'return id(esptime).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: lbl_info_date
                text: !lambda 'return id(esptime).now().strftime("%a %d %b");'
            # Update weather icon and color
            - lambda: |-
                if (!id(ha_weather).has_state()) return;
                std::string state = id(ha_weather).state;
                const char* icon = "\U000F0599";  // sunny default
                uint32_t color = 0xFFEB3B;  // yellow default
                
                if (state == "sunny") { icon = "\U000F0599"; color = 0xFFEB3B; }
                else if (state == "clear-night") { icon = "\U000F0594"; color = 0x3F51B5; }
                else if (state == "cloudy") { icon = "\U000F0590"; color = 0x9E9E9E; }
                else if (state == "partlycloudy") { icon = "\U000F0595"; color = 0x03A9F4; }
                else if (state == "rainy") { icon = "\U000F0597"; color = 0x2196F3; }
                else if (state == "pouring") { icon = "\U000F0596"; color = 0x1565C0; }
                else if (state == "snowy") { icon = "\U000F0598"; color = 0xFFFFFF; }
                else if (state == "snowy-rainy") { icon = "\U000F067F"; color = 0x81D4FA; }
                else if (state == "fog") { icon = "\U000F0591"; color = 0x9E9E9E; }
                else if (state == "hail") { icon = "\U000F0592"; color = 0x00BCD4; }
                else if (state == "lightning") { icon = "\U000F0593"; color = 0xFFEB3B; }
                else if (state == "lightning-rainy") { icon = "\U000F067E"; color = 0xFFEB3B; }
                else if (state == "windy") { icon = "\U000F059D"; color = 0x009688; }
                else if (state == "windy-variant") { icon = "\U000F059E"; color = 0x009688; }
                else if (state == "exceptional") { icon = "\U000F0026"; color = 0xF44336; }
                
                lv_label_set_text(id(lbl_weather_icon), icon);
                lv_obj_set_style_text_color(id(lbl_weather_icon), lv_color_hex(color), LV_PART_MAIN);
                
                // Update alarm display (show only if valid)
                if (id(ha_alarm).has_state()) {
                  std::string alarm_state = id(ha_alarm).state;
                  bool valid = !alarm_state.empty() && 
                               alarm_state != "unavailable" && 
                               alarm_state != "unknown" &&
                               alarm_state != "undefined" &&
                               alarm_state != "None";
                  if (valid) {
                    std::string alarm_text = "\U000F0020  " + alarm_state;  // alarm icon + time
                    lv_label_set_text(id(lbl_info_alarm), alarm_text.c_str());
                    lv_obj_clear_flag(id(lbl_info_alarm), LV_OBJ_FLAG_HIDDEN);
                  } else {
                    lv_obj_add_flag(id(lbl_info_alarm), LV_OBJ_FLAG_HIDDEN);
                  }
                } else {
                  lv_obj_add_flag(id(lbl_info_alarm), LV_OBJ_FLAG_HIDDEN);
                }

  # Screen timeout and Screensaver logic
  - interval: 1s
    then:
      # 1. Screensaver Activation (Independent of power saving)
      - if:
          condition:
            - lvgl.is_idle:
                timeout: ${screensaver_timeout}
            - lambda: 'return lv_scr_act() != id(page_info)->obj;'
          then:
            - lvgl.page.show: page_info
            - light.turn_on:
                id: backlight
                brightness: 100%

      # 2. Power Saving (Dim/Off) - Respected only if Keep Awake is OFF
      - if:
          condition:
            - binary_sensor.is_off: ha_keep_awake
          then:
            - if:
                condition:
                  - lvgl.is_idle:
                      timeout: 60s
                then:
                  - if:
                      condition:
                        - switch.is_on: aod_mode
                      then:
                        - light.turn_on:
                            id: backlight
                            brightness: !lambda 'return id(aod_brightness).state / 100.0;'
                      else:
                        - lvgl.page.show: page_main
                        - light.turn_off: backlight
                else:
                  # Dimming check (30s)
                  - if:
                      condition:
                        - lvgl.is_idle:
                            timeout: 30s
                        - lambda: 'return id(backlight).current_values.get_brightness() > 0.31f;'
                      then:
                        - light.turn_on:
                            id: backlight
                            brightness: 30%